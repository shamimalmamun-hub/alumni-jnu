<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" width="100%" height="100%" style="background:#ffffff; font-family: 'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', 'Segoe UI', Arial, sans-serif;">
