name = "alumni-jnu"
main = "src/worker.ts"
compatibility_date = "2026-08-25"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
exclude = ["*.map", "*.pdf", "*.jfif"]


# Cloudflare D1 (replaces Firestore). Create it once with `npx wrangler d1 create alumni-jnu`,
# paste the printed database_id below, then run `npm run db:migrate:remote`.
[[d1_databases]]
binding = "DB"
database_name = "alumni-jnu"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Firebase Auth is still used for admin Google sign-in; the Worker verifies the ID token.
FIREBASE_PROJECT_ID = "academic-domain-2rr5c"
# Comma-separated Google accounts allowed into the admin dashboard.
ADMIN_EMAILS = ""
# Secrets (set with `npx wrangler secret put`): ADMIN_PIN, ADMIN_TOKEN_SECRET, RESEND_API_KEY
